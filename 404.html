<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Redbot</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0f1a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* Il 404 ha il tono del gioco invece di un "Not Found" di default. */
  .four { min-height: 100vh; display: grid; place-items: center; text-align: center; }
  .four h1 { font-size: clamp(4rem, 18vw, 9rem); color: var(--wall); margin: 0; }
  .cone {
    width: 200px; height: 120px; margin: 0 auto 26px;
    background: rgba(255,217,77,0.18);
    clip-path: polygon(0 0, 100% 34%, 100% 66%, 0 100%);
  }
  a.back { color: var(--cone); font-family: var(--mono); letter-spacing: .1em; }
</style>
</head>
<body>
  <div class="wrap four">
    <div>
      <div class="cone" aria-hidden="true"></div>
      <h1>404</h1>
      <p class="lead" style="margin:0 auto 8px">Questa zona non è in ombra: sei visto.</p>
      <p><a class="back" href="/">&larr; torna al deposito</a></p>
    </div>
  </div>
</body>
</html>
